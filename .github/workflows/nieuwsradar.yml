name: Nieuwsradar

on:
  schedule:
    - cron: "*/20 * * * *"   # elke 20 minuten (GitHub start soms later of slaat een ronde over)
  workflow_dispatch:          # handmatig starten via de knop 'Run workflow'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: nieuwsradar
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nieuws ophalen
        run: |
          mkdir -p site
          python nieuwsradar.py
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt

      - name: Geheugen (nieuw/gezien) bewaren
        run: |
          git config user.name "nieuwsradar-bot"
          git config user.email "nieuwsradar-bot@users.noreply.github.com"
          git add nieuwsradar_data.json
          git diff --cached --quiet || git commit -m "Nieuwsradar $(date +'%d-%m %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub start geplande rondes voor dit account niet betrouwbaar.
  # Daarom start elke ronde na 15 minuten zelf de volgende (tenzij er al een klaarstaat).
  volgende:
    needs: ophalen
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Wachten en volgende ronde starten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 900
          actief=$(gh run list --workflow nieuwsradar.yml --limit 20 --json databaseId,status --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length')
          if [ "$actief" = "0" ]; then
            gh workflow run nieuwsradar.yml --ref main
          else
            echo "Er staat al een ronde klaar; geen nieuwe gestart."
          fi
